name: Build Test Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-ec2-task-app
  CONTAINER_NAME: devops-ec2-task-app

jobs:
  build-test-push:
    name: Build, Test and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.LOGIN_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        working-directory: app
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-test-push

    steps:
      - name: Deploy latest container to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/devops-ec2-task-app"
            CONTAINER_NAME="devops-ec2-task-app"
            AWS_REGION="${{ secrets.AWS_REGION }}"
            LOG_GROUP="/ec2/devops-ec2-task/app"

            echo "${{ secrets.LOGIN_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull $IMAGE_NAME:latest

            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 80:3000 \
              --log-driver=awslogs \
              --log-opt awslogs-region=$AWS_REGION \
              --log-opt awslogs-group=$LOG_GROUP \
              --log-opt awslogs-stream=$CONTAINER_NAME \
              $IMAGE_NAME:latest

            sleep 5
            curl -f http://localhost/health
            docker ps
